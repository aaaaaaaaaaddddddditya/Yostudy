<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yostudy - Latest News & Updates</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%236366f1'/><g transform='translate(50, 40)'><path d='M 20 10 L 20 90 L 50 90 L 50 10 Z' fill='%23ffffff' stroke='%23ec4899' stroke-width='2'/><path d='M 50 10 L 50 90 L 80 90 L 80 10 Z' fill='%23ec4899' stroke='%23ffffff' stroke-width='2'/><rect x='48' y='10' width='4' height='80' fill='%23ffffff'/><line x1='25' y1='25' x2='45' y2='25' stroke='%23ec4899' stroke-width='1.5'/><line x1='25' y1='35' x2='45' y2='35' stroke='%23ec4899' stroke-width='1.5'/><line x1='25' y1='45' x2='45' y2='45' stroke='%23ec4899' stroke-width='1.5'/><line x1='55' y1='25' x2='75' y2='25' stroke='%23ffffff' stroke-width='1.5'/><line x1='55' y1='35' x2='75' y2='35' stroke='%23ffffff' stroke-width='1.5'/><line x1='55' y1='45' x2='75' y2='45' stroke='%23ffffff' stroke-width='1.5'/></g><text x='100' y='140' font-size='60' font-weight='bold' text-anchor='middle' fill='%23ffffff' font-family='Arial'>Y</text></svg>" />
</head>
<body>
    <!-- NAVBAR -->
    <!-- NAVBAR -->
    <nav>
        <div class="navbar">
            <a href="index.html" class="logo">✨ Yostudy</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="study.html">Subjects</a></li>
                <li><a href="calculators-hub.html">Calculators</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="download-zone.html">Learn</a></li>
                <li><a href="#">My Bookmarks</a></li>
            </ul>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero" style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);">
        <div class="hero-content">
            <h1>📰 Latest News & Updates</h1>
            <p>Stay informed with the latest educational news, updates, and announcements</p>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- NEWS FILTER -->
        <div class="news-filter">
            <button class="filter-btn active" onclick="filterNews('all')">All News</button>
            <button class="filter-btn" onclick="filterNews('updates')">Updates</button>
            <button class="filter-btn" onclick="filterNews('announcements')">Announcements</button>
            <button class="filter-btn" onclick="filterNews('events')">Events</button>
        </div>

        <!-- NEWS GRID -->
        <div class="news-grid" id="newsGrid">
            <!-- News items will be loaded here -->
        </div>

        <!-- ADMIN BUTTON -->
        <div class="admin-section">
            <button class="btn-primary" onclick="showAdminPanel()">📋 News Admin Panel</button>
        </div>
    </main>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal" class="modal">
        <div class="modal-content admin-panel">
            <span class="close" onclick="closeAdminPanel()">&times;</span>
            <h2>📋 News Management Panel</h2>

            <!-- ADD NEWS FORM -->
            <div class="admin-form">
                <h3>Add New News</h3>
                <form id="newsForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="newsTitle" placeholder="News title" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="newsCategory" required>
                            <option value="updates">Updates</option>
                            <option value="announcements">Announcements</option>
                            <option value="events">Events</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="newsDescription" placeholder="News description" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="newsImage" placeholder="Image URL (optional)">
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="newsAuthor" placeholder="Author name" required>
                    </div>
                    <button type="submit" class="btn-primary">Add News</button>
                </form>
            </div>

            <!-- NEWS LIST -->
            <div class="admin-list">
                <h3>All News</h3>
                <div id="newsList" class="news-items-list">
                    <!-- News items will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <img src="yostudy-logo.png" style="height: 60px;">
            <p>Study Smart, Achieve More! 📚✨</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // News data stored in localStorage
        const NEWS_KEY = 'yostudy_news';
        
        // Initialize news data
        function initializeNews() {
            const existingNews = localStorage.getItem(NEWS_KEY);
            if (!existingNews) {
                const defaultNews = [
                    {
                        id: 1,
                        title: 'Welcome to Yostudy News',
                        category: 'announcements',
                        description: 'We are excited to launch our News section! Stay updated with the latest educational content, announcements, and events.',
                        image: 'https://via.placeholder.com/300x200/6366f1/ffffff?text=Yostudy+News',
                        author: 'Yostudy Team',
                        date: new Date().toISOString()
                    },
                    {
                        id: 2,
                        title: 'New Calculators Added',
                        category: 'updates',
                        description: 'We have added 50 new calculators to help you solve complex mathematical problems. Check out our Calculators Hub!',
                        image: 'https://via.placeholder.com/300x200/ec4899/ffffff?text=New+Calculators',
                        author: 'Admin',
                        date: new Date().toISOString()
                    }
                ];
                localStorage.setItem(NEWS_KEY, JSON.stringify(defaultNews));
            }
            displayNews('all');
        }

        // Display news items
        function displayNews(filter = 'all') {
            const newsData = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
            const newsGrid = document.getElementById('newsGrid');
            
            let filteredNews = newsData;
            if (filter !== 'all') {
                filteredNews = newsData.filter(news => news.category === filter);
            }

            newsGrid.innerHTML = filteredNews.length > 0 ? filteredNews.reverse().map(news => `
                <div class="news-card" data-category="${news.category}">
                    <img src="${news.image}" alt="${news.title}" class="news-image">
                    <div class="news-content">
                        <span class="news-category">${capitalizeFirst(news.category)}</span>
                        <h3>${news.title}</h3>
                        <p>${news.description.substring(0, 150)}...</p>
                        <div class="news-meta">
                            <span>By ${news.author}</span>
                            <span>${new Date(news.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                </div>
            `).join('') : '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--light-text);">No news available</p>';
        }

        // Filter news
        function filterNews(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayNews(category);
        }

        // Show admin panel
        function showAdminPanel() {
            document.getElementById('adminModal').style.display = 'block';
            loadNewsListInAdmin();
        }

        // Close admin panel
        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // Load news list in admin
        function loadNewsListInAdmin() {
            const newsData = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
            const newsList = document.getElementById('newsList');
            
            newsList.innerHTML = newsData.length > 0 ? newsData.reverse().map(news => `
                <div class="news-item-admin">
                    <div class="news-item-info">
                        <h4>${news.title}</h4>
                        <p>${news.description.substring(0, 100)}...</p>
                        <small>By ${news.author} - ${new Date(news.date).toLocaleDateString()}</small>
                    </div>
                    <div class="news-item-actions">
                        <button class="btn-small btn-danger" onclick="deleteNews(${news.id})">Delete</button>
                    </div>
                </div>
            `).join('') : '<p>No news added yet</p>';
        }

        // Add news
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newsData = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
            const newNews = {
                id: Date.now(),
                title: document.getElementById('newsTitle').value,
                category: document.getElementById('newsCategory').value,
                description: document.getElementById('newsDescription').value,
                image: document.getElementById('newsImage').value || 'https://via.placeholder.com/300x200/6366f1/ffffff?text=News',
                author: document.getElementById('newsAuthor').value,
                date: new Date().toISOString()
            };
            
            newsData.push(newNews);
            localStorage.setItem(NEWS_KEY, JSON.stringify(newsData));
            
            // Reset form
            this.reset();
            alert('News added successfully!');
            loadNewsListInAdmin();
            displayNews('all');
        });

        // Delete news
        function deleteNews(id) {
            if (confirm('Are you sure you want to delete this news?')) {
                let newsData = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
                newsData = newsData.filter(news => news.id !== id);
                localStorage.setItem(NEWS_KEY, JSON.stringify(newsData));
                loadNewsListInAdmin();
                displayNews('all');
            }
        }

        // Helper function
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('adminModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize on page load
        initializeNews();
    </script>

    <style>
        .news-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .news-card {
            background: var(--light-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease;
        }

        body.dark-mode .news-card {
            background: var(--dark-card);
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.2);
        }

        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .news-content {
            padding: 20px;
        }

        .news-category {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .news-card h3 {
            margin: 10px 0;
            color: var(--primary);
        }

        .news-card p {
            color: var(--light-text);
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        body.dark-mode .news-card p {
            color: var(--dark-text);
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #999;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .admin-section {
            text-align: center;
            margin: 40px 0;
        }

        .admin-panel {
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .admin-form {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        body.dark-mode .admin-form {
            background: var(--dark-bg);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--primary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group select,
        body.dark-mode .form-group textarea {
            background: var(--dark-card);
            color: var(--dark-text);
            border-color: #444;
        }

        .admin-list {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
        }

        body.dark-mode .admin-list {
            background: var(--dark-bg);
        }

        .news-items-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .news-item-admin {
            background: var(--light-card);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode .news-item-admin {
            background: var(--dark-card);
        }

        .news-item-info h4 {
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .news-item-info p {
            margin: 5px 0;
            font-size: 0.9em;
            color: var(--light-text);
        }

        body.dark-mode .news-item-info p {
            color: var(--dark-text);
        }

        .news-item-info small {
            color: #999;
        }

        .news-item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }
    </style>
</body>
</html>
