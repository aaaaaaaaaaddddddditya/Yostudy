<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yostudy - Study by Class & Subject</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%236366f1'/><g transform='translate(50, 40)'><path d='M 20 10 L 20 90 L 50 90 L 50 10 Z' fill='%23ffffff' stroke='%23ec4899' stroke-width='2'/><path d='M 50 10 L 50 90 L 80 90 L 80 10 Z' fill='%23ec4899' stroke='%23ffffff' stroke-width='2'/><rect x='48' y='10' width='4' height='80' fill='%23ffffff'/><line x1='25' y1='25' x2='45' y2='25' stroke='%23ec4899' stroke-width='1.5'/><line x1='25' y1='35' x2='45' y2='35' stroke='%23ec4899' stroke-width='1.5'/><line x1='25' y1='45' x2='45' y2='45' stroke='%23ec4899' stroke-width='1.5'/><line x1='55' y1='25' x2='75' y2='25' stroke='%23ffffff' stroke-width='1.5'/><line x1='55' y1='35' x2='75' y2='35' stroke='%23ffffff' stroke-width='1.5'/><line x1='55' y1='45' x2='75' y2='45' stroke='%23ffffff' stroke-width='1.5'/></g><text x='100' y='140' font-size='60' font-weight='bold' text-anchor='middle' fill='%23ffffff' font-family='Arial'>Y</text></svg>" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1E40AF;
            --secondary: #7C3AED;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }

        body.dark-mode {
            background-color: #0f172a;
        }

        /* NAVBAR */
        nav {
            background: white;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.dark-mode nav {
            background: #1e293b;
        }

        .navbar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        body.dark-mode .nav-links a {
            color: #f1f5f9;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 50%, #8B5CF6 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .section-title {
            font-size: 2em;
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
        }

        body.dark-mode .section-title {
            color: #60A5FA;
        }

        /* CLASS SELECTOR */
        .class-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 50px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .class-btn {
            padding: 12px 25px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1em;
        }

        body.dark-mode .class-btn {
            background: #1e293b;
            color: #60A5FA;
            border-color: #60A5FA;
        }

        .class-btn.active {
            background: var(--primary);
            color: white;
        }

        .class-btn:hover {
            transform: translateY(-2px);
        }

        /* SUBJECTS GRID */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .subject-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        body.dark-mode .subject-card {
            background: #1e293b;
        }

        .subject-card:hover {
            transform: translateY(-8px);
            border-top: 4px solid var(--primary);
        }

        .subject-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .subject-card h3 {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        body.dark-mode .subject-card h3 {
            color: #f1f5f9;
        }

        .subject-card p {
            color: #999;
            font-size: 0.9em;
        }

        /* CONTENT SECTION */
        .content-section {
            background: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        body.dark-mode .content-section {
            background: #1e293b;
        }

        .content-section h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        body.dark-mode .content-section h2 {
            color: #60A5FA;
        }

        .content-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .content-item {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        body.dark-mode .content-item {
            background: #0f172a;
        }

        .content-item strong {
            color: var(--primary);
        }

        body.dark-mode .content-item strong {
            color: #60A5FA;
        }

        /* FOOTER */
        footer {
            background: #1f2937;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        body.dark-mode footer {
            background: #0f172a;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2em;
            }

            .section-title {
                font-size: 1.5em;
            }

            .class-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav>
        <div class="navbar">
            <a href="index.html" class="logo">☀️ Yostudy</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="study.html">Subjects</a></li>
                <li><a href="calculators-hub.html">Calculators</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="download-zone.html">Learn</a></li>
            </ul>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>📚 Subjects by Class</h1>
        <p>Choose your class and explore all subjects with complete study materials</p>
    </section>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- CLASS SELECTOR -->
        <div class="class-selector">
            <button class="class-btn active" onclick="selectClass(1)">Class 1</button>
            <button class="class-btn" onclick="selectClass(2)">Class 2</button>
            <button class="class-btn" onclick="selectClass(3)">Class 3</button>
            <button class="class-btn" onclick="selectClass(4)">Class 4</button>
            <button class="class-btn" onclick="selectClass(5)">Class 5</button>
            <button class="class-btn" onclick="selectClass(6)">Class 6</button>
            <button class="class-btn" onclick="selectClass(7)">Class 7</button>
            <button class="class-btn" onclick="selectClass(8)">Class 8</button>
            <button class="class-btn" onclick="selectClass(9)">Class 9</button>
        </div>

        <!-- SUBJECTS -->
        <h2 class="section-title" id="classTitle">Class 1 Subjects</h2>
        <div class="subjects-grid" id="subjectsGrid"></div>

        <!-- LEARNING TRICKS -->
        <div class="content-section">
            <h2>💡 Learning Tricks</h2>
            <div class="content-list" id="tricksList"></div>
        </div>

        <!-- FORMULAS -->
        <div class="content-section">
            <h2>📐 Important Formulas</h2>
            <div class="content-list" id="formulasList"></div>
        </div>

        <!-- RESOURCES -->
        <div class="content-section">
            <h2>📊 Recommended Resources</h2>
            <div class="content-list" id="resourcesList"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Yostudy - Study Smart, Achieve More! 📚</p>
    </footer>

    <script>
        const classSubjects = {
            1: ['🔤 English', '🔢 Mathematics', '🎨 Art', '🌍 Environmental Studies', '🎵 Music'],
            2: ['🔤 English', '🔢 Mathematics', '🎨 Art', '🌍 Environmental Studies', '🎵 Music'],
            3: ['🔤 English', '🔢 Mathematics', '🌍 Environmental Studies', '⚽ Physical Education', '🎨 Art'],
            4: ['🔤 English', '🔢 Mathematics', '🌍 Social Studies', '⚽ Physical Education', '📚 Hindi'],
            5: ['🔤 English', '🔢 Mathematics', '🔬 Science', '🌍 Social Studies', '📚 Hindi'],
            6: ['🔤 English', '🔢 Mathematics', '🔬 Science', '🌍 Social Studies', '📚 Hindi'],
            7: ['🔤 English', '🔢 Mathematics', '🔬 Science', '🌍 Social Studies', '📚 Hindi'],
            8: ['🔤 English', '🔢 Mathematics', '🔬 Science', '🌍 Social Studies', '📚 Hindi'],
            9: ['🔤 English', '🔢 Mathematics', '🔬 Science', '🌍 Social Studies', '📚 Hindi']
        };

        const tricks = {
            1: ['Count with your fingers', 'Learn colors with objects', 'Practice writing letters daily', 'Use flashcards for words'],
            2: ['Build number sense', 'Read short stories', 'Practice addition with toys', 'Learn simple sentences'],
            3: ['Master place values', 'Read chapter books', 'Practice multiplication', 'Write short paragraphs'],
            4: ['Learn fractions basics', 'Improve reading comprehension', 'Practice word problems', 'Write stories'],
            5: ['Master percentages', 'Improve writing skills', 'Learn prime numbers', 'Practice problem-solving'],
            6: ['Learn algebraic basics', 'Master geometry concepts', 'Improve essay writing', 'Practice logical reasoning'],
            7: ['Master equations', 'Learn trigonometry basics', 'Understand chemical reactions', 'Practice critical thinking'],
            8: ['Solve complex equations', 'Learn advanced geometry', 'Understand physics concepts', 'Master data interpretation'],
            9: ['Master quadratic equations', 'Learn calculus basics', 'Master chemistry formulas', 'Practice advanced reasoning']
        };

        const formulas = {
            1: ['2 + 2 = 4', '5 - 3 = 2', '3 × 2 = 6', '10 ÷ 5 = 2'],
            2: ['Simple Addition', 'Simple Subtraction', 'Basic Multiplication', 'Division Basics'],
            3: ['Area = L × W', 'Perimeter = 2(L+W)', 'Circle Circumference', 'Triangle Area'],
            4: ['Fraction Addition', 'Decimal Concepts', 'Area = (B×H)/2', 'Circle Circumference = 2πr'],
            5: ['Percentage Formula', 'Ratio and Proportion', 'Average = Sum/Count', 'Speed = D/T'],
            6: ['Algebraic Expressions', 'Linear Equations', 'Pythagoras Theorem', 'Polygon Angles'],
            7: ['Quadratic Equations', 'Trigonometric Ratios', 'Compound Interest', 'Volume = L×W×H'],
            8: ['Logarithmic Properties', 'Advanced Trigonometry', 'Circle Theorems', 'Statistics Formulas'],
            9: ['Calculus Basics', 'Binomial Theorem', 'Probability Formulas', 'Complex Numbers']
        };

        function selectClass(classNum) {
            document.querySelectorAll('.class-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === classNum);
            });

            document.getElementById('classTitle').textContent = `Class ${classNum} Subjects`;

            const subjectsGrid = document.getElementById('subjectsGrid');
            subjectsGrid.innerHTML = classSubjects[classNum].map(subject => `
                <div class="subject-card">
                    <div class="subject-icon">${subject.split(' ')[0]}</div>
                    <h3>${subject.split(' ').slice(1).join(' ')}</h3>
                    <p>Complete curriculum</p>
                </div>
            `).join('');

            const tricksList = document.getElementById('tricksList');
            tricksList.innerHTML = tricks[classNum].map(trick => `
                <div class="content-item"><strong>💡</strong> ${trick}</div>
            `).join('');

            const formulasList = document.getElementById('formulasList');
            formulasList.innerHTML = formulas[classNum].map(formula => `
                <div class="content-item"><strong>📐</strong> ${formula}</div>
            `).join('');

            const resourcesList = document.getElementById('resourcesList');
            resourcesList.innerHTML = [
                `<div class="content-item"><strong>📚</strong> Study Notes - Class ${classNum}</div>`,
                `<div class="content-item"><strong>📝</strong> Practice Questions</div>`,
                `<div class="content-item"><strong>📊</strong> Sample Papers</div>`,
                `<div class="content-item"><strong>🎥</strong> Video Tutorials</div>`
            ].join('');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        selectClass(1);
    </script>
</body>
</html>
